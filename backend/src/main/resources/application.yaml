spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/duylongcomputer?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Temporary diagnostic setting: report connections held longer than 60s.
      # Set HIKARI_LEAK_DETECTION_THRESHOLD=0 after diagnosis to disable it.
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:computerduylong@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Spring AI (AI Agent). Mặc định TẮT: chọn nhà cung cấp bằng AI_AGENT_MODEL_PROVIDER=openai|google-genai và bật
  # ai.agent.enabled. Các loại mô hình khác (embedding, image, audio, moderation) không dùng nên tắt hẳn,
  # nếu không Spring AI sẽ đòi API key ngay lúc khởi động.
  ai:
    model:
      chat: ${AI_AGENT_MODEL_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # Không thử lại khi gọi mô hình lỗi: mặc định Spring AI thử lại 10 lần, chờ tới 3 phút giữa các lần, người dùng phải
    # đợi rất lâu. Agent lỗi thì chatbot đã tự quay về đường trả lời cũ. (Chỉ Gemini dùng cơ chế này; OpenAI xem max-retries.)
    retry:
      max-attempts: 0
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      # Lời gọi mô hình bị treo phải lỗi trong hạn của một câu hỏi (ai.agent.timeout-seconds) để quay về đường cũ.
      timeout: ${AI_AGENT_TIMEOUT_SECONDS:30}s
      max-retries: 0
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
    google:
      genai:
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.2
    # Mặc định Spring AI thử lại 10 lần với thời gian chờ tăng dần tới vài phút, giữ luồng request suốt thời gian đó.
    retry:
      max-attempts: ${AI_AGENT_RETRY_MAX_ATTEMPTS:3}
      backoff:
        max-interval: ${AI_AGENT_RETRY_MAX_INTERVAL:10s}

backup:
  path: ${BACKUP_PATH:/tmp/backups}

google:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}
  oauth:
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/email/google/callback}
    scopes: ${GOOGLE_OAUTH_SCOPES:https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/userinfo.email}
  encryption-key: ${TOKEN_ENCRYPTION_KEY:}

cloudinary:
  url: ${CLOUDINARY_URL:}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dummy_cloud_name}
  api-key: ${CLOUDINARY_API_KEY:dummy_api_key}
  api-secret: ${CLOUDINARY_API_SECRET:dummy_api_secret}
  folder: ${CLOUDINARY_FOLDER:duy-long-computer}
  max-file-size: ${CLOUDINARY_MAX_FILE_SIZE:5242880}

ai:
  agent:
    enabled: ${AI_AGENT_ENABLED:false}
    max-tool-calls: ${AI_AGENT_MAX_TOOL_CALLS:6}
    max-rows: ${AI_AGENT_MAX_ROWS:10}
    history-turns: ${AI_AGENT_HISTORY_TURNS:6}
    timeout-seconds: ${AI_AGENT_TIMEOUT_SECONDS:30}
  provider: ${AI_PROVIDER:gemini}
  openai:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  gemini:
    enabled: ${GEMINI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    # Model dự phòng cho OCR khi model chính quá tải / hết lượt / trả JSON hỏng. Để trống để tắt.
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash-lite}
    thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}


einvoice:
  active-provider: ${EINVOICE_PROVIDER:XINVOICE}
  xinvoice:
    base-url: ${XINVOICE_BASE_URL:https://api.xinvoice.vn}
    client-id: ${XINVOICE_CLIENT_ID:demo-client-id}
    api-key: ${XINVOICE_API_KEY:demo-api-key}
    auth-token: ${XINVOICE_AUTH_TOKEN:demo-auth-token}

app:
  frontend-url: ${FRONTEND_URL:https://dlc-wms.vercel.app}
  # Chỉ bật ở local/dev để debug - KHÔNG bật ở Production vì sẽ lộ chi tiết lỗi
  # (stack trace class name, message SQL/constraint...) cho client.
  expose-error-details: ${APP_EXPOSE_ERROR_DETAILS:false}
  jwt:
    # Bắt buộc set qua biến môi trường (backend/.env cục bộ, secret manager khi deploy).
    # Không đặt giá trị mặc định ở đây - nếu để trống, JwtUtils sẽ tự sinh secret ngẫu
    # nhiên cho từng lần khởi động (chỉ dùng được cho local/dev, token mất hiệu lực mỗi lần restart).
    secret: ${JWT_SECRET:}
