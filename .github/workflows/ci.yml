name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  backend-ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and Package Backend
        run: ./mvnw clean package -DskipTests

      - name: Clean Old Jars on VPS (CD)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
            mkdir -p /root/backend
            pkill -f 'java -jar' || true
            rm -f /root/backend/*.jar
          EOF

      - name: Create .env file from Secret
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: |
          cat << 'EOF' > target/.env
          ${{ secrets.ENV_PRODUCT }}
          EOF
          # Xóa các khoảng trắng thừa ở đầu dòng (nếu có do thụt lề YAML)
          sed -i 's/^[ \t]*//' target/.env

      - name: Upload JAR and .env to VPS (CD)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "backend/target/*.jar,backend/target/.env"
          target: "/root/backend"
          strip_components: 2

      - name: Start Spring Boot on VPS (CD)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          export SSHPASS="${{ secrets.VPS_PASSWORD }}"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} << 'EOF'
            cd /root/backend
            
            # Tải các biến môi trường từ file .env vừa upload
            set -a
            [ -f .env ] && source .env
            set +a
            
            # Khởi động ứng dụng (nó sẽ tự nhận các biến môi trường vừa load)
            nohup java -jar *.jar > app.log 2>&1 &
            sleep 3
          EOF
          echo "Successfully deployed!"
