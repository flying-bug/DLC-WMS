# Usage: cp .env.example .env, fill in the values, then: docker compose up --build
name: roomdesk

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomdesk
      POSTGRES_USER: roomdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomdesk -d roomdesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: roomdesk-api:1.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/roomdesk
      DB_USERNAME: roomdesk
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env and set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy .env.example to .env and set JWT_SECRET (at least 32 characters)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

volumes:
  db-data:
