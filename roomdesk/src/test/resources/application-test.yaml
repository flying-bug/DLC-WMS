# Test profile. The datasource comes from Testcontainers (@ServiceConnection).
# The JWT secret below is a test-only key and is never used outside src/test.
roomdesk:
  security:
    jwt:
      secret: test-only-secret-key-for-roomdesk-0123456789abcdef

logging:
  level:
    root: WARN
    com.fsa.roomdesk: INFO
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: OFF

spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true
