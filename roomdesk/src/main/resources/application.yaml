spring:
  application:
    name: roomdesk
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    mapper:
      sort-properties-alphabetically: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never

springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

roomdesk:
  time-zone: Asia/Ho_Chi_Minh
  security:
    jwt:
      secret: ${JWT_SECRET}
      ttl: 30m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
