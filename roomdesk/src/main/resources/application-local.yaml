# Local development against a PostgreSQL 17 running on this machine.
# DB_PASSWORD and JWT_SECRET must be provided as environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roomdesk}
    username: ${DB_USERNAME:roomdesk}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fsa.roomdesk: DEBUG
